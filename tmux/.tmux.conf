# My prefix key, same as I use in GNU screen
unbind-key C-b
set-option -g prefix C-g

# Mouse setup
# (tmux 2.1 collapsed mode-mouse / mouse-select-* / mouse-resize-pane into one option)
set -g mouse on

# Saner splitting.
bind v split-window -h
bind s split-window -v
bind S choose-session

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Fix slow escaping to normal mode
set -sg escape-time 0

# open a man page in new pane or window
# via @andyfowler
bind m command-prompt -p "man page:" "split-window -h 'exec man %%'"
bind M command-prompt -p "Man page:" "new-window -n 'man %1' 'exec man %1'"

# Vim-style selection and copy
# Setup 'v' to begin selection as in Vim
# (tmux 2.4 replaced `-t vi-copy` bindings with `-T copy-mode-vi` + `send -X`)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

set-option -g status-keys emacs
set-window-option -g mode-keys vi

set -g default-terminal "tmux-256color"

# start numbering windows @ 1
set -g base-index 1

# status line
set -g status-left-length 32
set -g status-right-length 150

# (tmux 2.9 replaced the *-fg / *-bg / *-attr options with unified *-style)
set -g status-style 'fg=white,bg=colour234'
set -g pane-border-style 'fg=colour245'
set -g pane-active-border-style 'fg=colour39'
set -g message-style 'fg=colour16,bg=colour221,bold'

set -g status-left '#[fg=colour235,bg=colour252,bold] #S '
set -g window-status-format '#[fg=white,bg=colour234] #I #W '
set -g window-status-current-format '#[fg=colour252,bg=colour39,noreverse,bold] #I #W '
set -g status-right '#[fg=colour240]%m-%d %H:%M '
